<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schedule → ICS Converter</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap');

  :root {
    --bg: #0d0f14;
    --surface: #161920;
    --border: #252830;
    --accent: #4f8ef7;
    --accent2: #7c6af7;
    --success: #3ecf8e;
    --text: #e8eaf0;
    --muted: #6b7080;
    --mono: 'DM Mono', monospace;
    --sans: 'Syne', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 16px;
  }

  header { text-align: center; margin-bottom: 40px; }

  header h1 {
    font-family: var(--sans);
    font-weight: 800;
    font-size: clamp(1.8rem, 5vw, 2.8rem);
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  header p { margin-top: 8px; color: var(--muted); font-size: 0.85rem; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    width: 100%;
    max-width: 620px;
    margin-bottom: 20px;
  }

  .card h2 {
    font-family: var(--sans);
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
  }

  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 8px;
    padding: 36px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    position: relative;
  }
  .dropzone:hover, .dropzone.drag-over {
    border-color: var(--accent);
    background: rgba(79,142,247,0.05);
  }
  .dropzone input[type=file] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .dropzone .icon { font-size: 2.2rem; margin-bottom: 10px; }
  .dropzone .label { font-family: var(--sans); font-weight: 600; font-size: 0.95rem; color: var(--text); }
  .dropzone .sublabel { font-size: 0.78rem; color: var(--muted); margin-top: 4px; }
  .file-name { margin-top: 12px; font-size: 0.8rem; color: var(--accent); font-family: var(--mono); }

  .preview-wrap {
    max-height: 260px;
    overflow-y: auto;
    border-radius: 6px;
    border: 1px solid var(--border);
  }
  .preview-wrap::-webkit-scrollbar { width: 6px; }
  .preview-wrap::-webkit-scrollbar-track { background: transparent; }
  .preview-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
  thead tr { background: var(--bg); position: sticky; top: 0; z-index: 1; }
  th {
    padding: 8px 12px; text-align: left; color: var(--muted); font-weight: 500;
    letter-spacing: 0.06em; text-transform: uppercase; font-size: 0.68rem;
    border-bottom: 1px solid var(--border);
  }
  td { padding: 7px 12px; border-bottom: 1px solid rgba(37,40,48,0.6); font-family: var(--mono); }
  tr:last-child td { border-bottom: none; }

  .badge { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 0.68rem; font-weight: 500; }
  .badge-shift { background: rgba(79,142,247,0.15); color: var(--accent); }
  .badge-other { background: rgba(124,106,247,0.15); color: #7c6af7; }

  .stats { display: flex; gap: 20px; margin-top: 14px; font-size: 0.78rem; color: var(--muted); }
  .stats span { color: var(--text); font-weight: 500; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 11px 22px;
    border-radius: 7px; border: none; font-family: var(--sans); font-weight: 600;
    font-size: 0.88rem; cursor: pointer; transition: opacity 0.15s, transform 0.1s;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; width: 100%; justify-content: center; font-size: 0.95rem; padding: 14px;
  }
  .btn-primary:not(:disabled):hover { opacity: 0.88; }

  .status { padding: 10px 14px; border-radius: 6px; font-size: 0.8rem; margin-top: 12px; display: none; }
  .status.error   { background: rgba(247,99,99,0.12); border: 1px solid rgba(247,99,99,0.3); color: #f76363; }
  .status.success { background: rgba(62,207,142,0.12); border: 1px solid rgba(62,207,142,0.3); color: var(--success); }
  .status.show    { display: block; }

  .empty-state { text-align: center; padding: 32px; color: var(--muted); font-size: 0.82rem; }
</style>
</head>
<body>

<header>
  <h1>Schedule → ICS</h1>
  <p>Convert your roster (.doc, .txt or .csv) to a calendar file</p>
</header>

<!-- Upload -->
<div class="card">
  <h2>1 — Upload File</h2>
  <div class="dropzone" id="dropzone">
    <input type="file" id="fileInput" accept=".txt,.csv,.rtf,.doc">
    <div class="icon">📂</div>
    <div class="label">Drop file here or click to browse</div>
    <div class="sublabel">Supports .doc, .txt (RTF roster) and .csv</div>
  </div>
  <div class="file-name" id="fileName"></div>
</div>

<!-- Preview -->
<div class="card">
  <h2>2 — Preview</h2>
  <div id="previewContent">
    <div class="empty-state">Upload a file to see a preview</div>
  </div>
</div>

<!-- Export -->
<div class="card">
  <h2>3 — Export</h2>
  <button class="btn btn-primary" id="exportBtn" disabled>
    ⬇ Download .ics File
  </button>
  <div class="status" id="statusMsg"></div>
</div>

<script>
const TZ       = 'Europe/Copenhagen';
const CAL_NAME = 'Work Schedule';

let parsedEvents    = [];
let detectedYear    = new Date().getFullYear();
let detectedMonth   = new Date().getMonth() + 1;
let detectedFilename = 'schedule';

const fileInput      = document.getElementById('fileInput');
const dropzone       = document.getElementById('dropzone');
const fileName       = document.getElementById('fileName');
const exportBtn      = document.getElementById('exportBtn');
const statusMsg      = document.getElementById('statusMsg');
const previewContent = document.getElementById('previewContent');

// ── Drag & drop ────────────────────────────────────────────────────────
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag-over'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('drag-over');
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files[0]) handleFile(fileInput.files[0]);
});

// ── File handling ──────────────────────────────────────────────────────
function handleFile(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  detectedFilename = file.name.replace(/\.[^.]+$/, '');
  fileName.textContent = '📄 ' + file.name;
  setStatus('', '');

  const reader = new FileReader();
  reader.onload = e => {
    try {
      const raw = e.target.result;
      parsedEvents = ext === 'csv' ? parseCSV(raw) : parseRTF(raw);
      renderPreview(parsedEvents);
      exportBtn.disabled = parsedEvents.length === 0;
    } catch(err) {
      setStatus('error', 'Parse error: ' + err.message);
    }
  };
  reader.readAsText(file, 'latin1');
}

// ── Detect year/month from text ────────────────────────────────────────
function detectYearMonth(text) {
  const months = ['january','february','march','april','may','june',
                  'july','august','september','october','november','december'];
  const lower = text.toLowerCase();
  for (let i = 0; i < months.length; i++) {
    if (lower.includes(months[i])) { detectedMonth = i + 1; break; }
  }
  const y = text.match(/20\d{2}/);
  if (y) detectedYear = parseInt(y[0]);
}

// ── RTF Parser ─────────────────────────────────────────────────────────
function parseRTF(raw) {
  let text = raw
    .replace(/\\'d8/gi, 'Ø').replace(/\\'f8/gi, 'ø')
    .replace(/\\'e6/gi, 'æ').replace(/\\'c6/gi, 'Æ')
    .replace(/\\'e5/gi, 'å').replace(/\\'c5/gi, 'Å')
    .replace(/\\[a-z]+[-]?\d*[ ]?/gi, '')
    .replace(/[{}]/g, '')
    .replace(/\r/g, '');

  detectYearMonth(text);

  const events = [];
  for (const line of text.split('\n').map(l => l.trim()).filter(Boolean)) {
    const m = line.match(/^\s*(\d{1,2})\s+\w+\s+([\w\-:().]+(?:\s+[\w\-.()]+)?)\s*(.*)/);
    if (!m) continue;

    const day   = parseInt(m[1]);
    const shift = m[2].trim();
    const note  = m[3].trim();

    if (day < 1 || day > 31) continue;
    if (/^fridag$/i.test(shift)) continue;

    const dateStr = `${detectedYear}-${String(detectedMonth).padStart(2,'0')}-${String(day).padStart(2,'0')}`;

    const tm = shift.match(/^(\d{2})(\d{2})-(\d{4})[A-Z]?$/);
    if (tm) {
      const summary = normalizeLabel(note) || shift;
      events.push({ date: dateStr, summary, start: `${tm[1]}:${tm[2]}`, end: `${tm[3].slice(0,2)}:${tm[3].slice(2)}`, allDay: false, note: shift });
    } else if (shift) {
      events.push({ date: dateStr, summary: normalizeLabel(shift), start: null, end: null, allDay: true, note });
    }
  }
  return events;
}

// ── CSV Parser ─────────────────────────────────────────────────────────
function parseCSV(raw) {
  const fixed = raw
    .replace(/\x00/g, '')
    .replace(/F\nL /gi, 'FØL ')
    .replace(/f\nl /gi, 'føl ');

  detectYearMonth(fixed);

  const lines = fixed.split('\n').map(l => l.trim()).filter(Boolean);
  if (lines.length < 2) throw new Error('CSV appears empty');

  const events = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = splitCSVLine(lines[i]);
    if (cols.length < 3) continue;

    let subject     = cols[0].trim();
    const startDate = cols[1].trim();
    const startTime = cols[2].trim();
    const endTime   = cols[4] ? cols[4].trim() : '';
    const allDay    = cols[5] ? cols[5].trim().toUpperCase() === 'TRUE' : false;

    if (!startDate) continue;
    const dp = startDate.split('/');
    if (dp.length < 3) continue;
    const dateStr = `${dp[2]}-${dp[1].padStart(2,'0')}-${dp[0].padStart(2,'0')}`;

    subject = subject.replace(/^\d{4}-\d{4}[A-Z]?\s+/, '').replace(/[()]/g, '').trim();
    subject = normalizeLabel(subject);

    if (/^fridag$/i.test(subject)) continue;

    if (allDay || !startTime) {
      events.push({ date: dateStr, summary: subject, start: null, end: null, allDay: true, note: '' });
    } else {
      events.push({ date: dateStr, summary: subject, start: startTime, end: endTime || startTime, allDay: false, note: '' });
    }
  }
  return events;
}

function splitCSVLine(line) {
  const result = []; let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    if (line[i] === '"') { inQ = !inQ; }
    else if (line[i] === ',' && !inQ) { result.push(cur); cur = ''; }
    else cur += line[i];
  }
  result.push(cur);
  return result;
}

function normalizeLabel(s) {
  return s.replace(/f[øo8]l/gi, 'FOL').replace(/\s+/g, ' ').trim()
          .replace(/\b\w/g, c => c.toUpperCase());
}

// ── Preview ────────────────────────────────────────────────────────────
function renderPreview(events) {
  if (!events.length) {
    previewContent.innerHTML = '<div class="empty-state">No events found. Check file format.</div>';
    return;
  }
  const shifts = events.filter(e => !e.allDay).length;
  const other  = events.filter(e => e.allDay).length;

  let html = `<div class="preview-wrap"><table><thead><tr>
    <th>Date</th><th>Summary</th><th>Time</th><th>Type</th>
  </tr></thead><tbody>`;
  for (const ev of events) {
    const badge = ev.allDay
      ? `<span class="badge badge-other">other</span>`
      : `<span class="badge badge-shift">shift</span>`;
    html += `<tr><td>${ev.date}</td><td>${ev.summary}</td><td>${ev.allDay ? '—' : `${ev.start} – ${ev.end}`}</td><td>${badge}</td></tr>`;
  }
  html += `</tbody></table></div>
    <div class="stats">
      <div>Total: <span>${events.length}</span></div>
      <div>Shifts: <span>${shifts}</span></div>
      ${other ? `<div>Other: <span>${other}</span></div>` : ''}
    </div>`;
  previewContent.innerHTML = html;
}

// ── ICS Generation ─────────────────────────────────────────────────────
function generateICS(events) {
  const now = new Date().toISOString().replace(/[-:.]/g,'').slice(0,15) + 'Z';
  const tzBlock = `BEGIN:VTIMEZONE\r\nTZID:${TZ}\r\nBEGIN:STANDARD\r\nDTSTART:19701025T030000\r\nRRULE:FREQ=YEARLY;BYDAY=-1SU;BYMONTH=10\r\nTZOFFSETFROM:+0200\r\nTZOFFSETTO:+0100\r\nTZNAME:CET\r\nEND:STANDARD\r\nBEGIN:DAYLIGHT\r\nDTSTART:19700329T020000\r\nRRULE:FREQ=YEARLY;BYDAY=-1SU;BYMONTH=3\r\nTZOFFSETFROM:+0100\r\nTZOFFSETTO:+0200\r\nTZNAME:CEST\r\nEND:DAYLIGHT\r\nEND:VTIMEZONE`;

  let cal = `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//TCOBuddy//Schedule Converter//EN\r\nCALSCALE:GREGORIAN\r\nMETHOD:PUBLISH\r\nX-WR-CALNAME:${CAL_NAME}\r\nX-WR-TIMEZONE:${TZ}\r\n${tzBlock}\r\n`;

  events.forEach((ev, idx) => {
    const uid     = `${ev.date.replace(/-/g,'')}-${idx}@tcobuddy`;
    const desc    = ev.note ? `DESCRIPTION:${ev.note}\r\n` : '';
    const summary = ev.summary.replace(/,/g, '\\,').replace(/;/g, '\\;');

    if (ev.allDay) {
      const d = ev.date.replace(/-/g,'');
      cal += `BEGIN:VEVENT\r\nUID:${uid}\r\nDTSTAMP:${now}\r\nDTSTART;VALUE=DATE:${d}\r\nDTEND;VALUE=DATE:${d}\r\nSUMMARY:${summary}\r\n${desc}END:VEVENT\r\n`;
    } else {
      const startDT = ev.date.replace(/-/g,'') + 'T' + ev.start.replace(':','') + '00';
      let endDT;
      if (ev.end === '24:00' || ev.end === '2400') {
        const d = new Date(ev.date + 'T00:00:00');
        d.setDate(d.getDate() + 1);
        endDT = d.toISOString().slice(0,10).replace(/-/g,'') + 'T000000';
      } else {
        endDT = ev.date.replace(/-/g,'') + 'T' + ev.end.replace(':','') + '00';
      }
      cal += `BEGIN:VEVENT\r\nUID:${uid}\r\nDTSTAMP:${now}\r\nDTSTART;TZID=${TZ}:${startDT}\r\nDTEND;TZID=${TZ}:${endDT}\r\nSUMMARY:${summary}\r\n${desc}END:VEVENT\r\n`;
    }
  });

  return cal + `END:VCALENDAR\r\n`;
}

// ── Export ─────────────────────────────────────────────────────────────
exportBtn.addEventListener('click', () => {
  if (!parsedEvents.length) return;
  try {
    const blob = new Blob([generateICS(parsedEvents)], { type: 'text/calendar;charset=utf-8' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url;
    a.download = `${detectedFilename}.ics`;
    a.click();
    URL.revokeObjectURL(url);
    setStatus('success', `✓ Downloaded ${parsedEvents.length} events as .ics`);
  } catch(err) {
    setStatus('error', 'Export failed: ' + err.message);
  }
});

function setStatus(type, msg) {
  statusMsg.className = 'status';
  if (!type) return;
  statusMsg.classList.add(type, 'show');
  statusMsg.textContent = msg;
}
</script>
</body>
</html>
