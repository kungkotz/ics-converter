<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Schedule → ICS Converter</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap');

  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --border: #dde0e8;
    --accent: #3a7ef5;
    --accent2: #6a59f0;
    --success: #2db87a;
    --text: #1a1d26;
    --muted: #8a90a0;
    --mono: 'DM Mono', monospace;
    --sans: 'Syne', sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0f14;
      --surface: #161920;
      --border: #252830;
      --accent: #4f8ef7;
      --accent2: #7c6af7;
      --success: #3ecf8e;
      --text: #e8eaf0;
      --muted: #6b7080;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 16px;
  }

  header { text-align: center; margin-bottom: 40px; }
  header h1 {
    font-family: var(--sans); font-weight: 800;
    font-size: clamp(1.8rem, 5vw, 2.8rem); letter-spacing: -0.03em;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  header p { margin-top: 8px; color: var(--muted); font-size: 0.85rem; }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 28px; width: 100%; max-width: 640px; margin-bottom: 20px;
  }
  .card h2 {
    font-family: var(--sans); font-size: 0.75rem; font-weight: 600;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 16px;
  }

  .dropzone {
    border: 2px dashed var(--border); border-radius: 8px; padding: 36px 20px;
    text-align: center; cursor: pointer; transition: border-color 0.2s, background 0.2s; position: relative;
  }
  .dropzone:hover, .dropzone.drag-over { border-color: var(--accent); background: rgba(79,142,247,0.05); }
  .dropzone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .dropzone .icon { font-size: 2.2rem; margin-bottom: 10px; }
  .dropzone .label { font-family: var(--sans); font-weight: 600; font-size: 0.95rem; color: var(--text); }
  .dropzone .sublabel { font-size: 0.78rem; color: var(--muted); margin-top: 4px; }
  .file-name { margin-top: 12px; font-size: 0.8rem; color: var(--accent); }

  .preview-wrap {
    max-height: 300px; overflow-y: auto; border-radius: 6px; border: 1px solid var(--border);
  }
  .preview-wrap::-webkit-scrollbar { width: 6px; }
  .preview-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
  thead tr { background: var(--bg); position: sticky; top: 0; z-index: 1; }
  th {
    padding: 8px 12px; text-align: left; color: var(--muted); font-weight: 500;
    letter-spacing: 0.06em; text-transform: uppercase; font-size: 0.68rem; border-bottom: 1px solid var(--border);
  }
  td { padding: 7px 12px; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: none; }

  .badge {
    display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 0.68rem; font-weight: 500; white-space: nowrap;
  }
  .badge-shift           { background: rgba(79,142,247,0.15);  color: var(--accent); }
  .badge-extra-company   { background: rgba(45,184,122,0.15);  color: #2db87a; }
  .badge-extra-colleague { background: rgba(247,179,79,0.15);  color: #c98a00; }
  .badge-dayoff          { background: rgba(138,144,160,0.12); color: var(--muted); }
  .badge-fridag          { background: rgba(124,106,247,0.15); color: #7c6af7; }

  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .stat-box {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px;
  }
  .stat-box .stat-label { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
  .stat-box .stat-value { font-family: var(--sans); font-weight: 700; font-size: 1.15rem; color: var(--text); }
  .stat-box .stat-sub   { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }
  .stat-box.accent  { border-color: rgba(79,142,247,0.4); }
  .stat-box.success { border-color: rgba(45,184,122,0.4); }
  .stat-box.warn    { border-color: rgba(247,179,79,0.4); }
  .stat-box.purple  { border-color: rgba(124,106,247,0.4); }

  .btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 11px 22px;
    border-radius: 7px; border: none; font-family: var(--sans); font-weight: 600;
    font-size: 0.88rem; cursor: pointer; transition: opacity 0.15s, transform 0.1s;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; width: 100%; justify-content: center; font-size: 0.95rem; padding: 14px;
  }
  .btn-primary:not(:disabled):hover { opacity: 0.88; }

  .status { padding: 10px 14px; border-radius: 6px; font-size: 0.8rem; margin-top: 12px; display: none; }
  .status.error   { background: rgba(247,99,99,0.12); border: 1px solid rgba(247,99,99,0.3); color: #f76363; }
  .status.success { background: rgba(62,207,142,0.12); border: 1px solid rgba(62,207,142,0.3); color: var(--success); }
  .status.show    { display: block; }

  .empty-state { text-align: center; padding: 32px; color: var(--muted); font-size: 0.82rem; }

  .btn-clear {
    margin-top: 10px; background: transparent; border: 1px solid var(--border);
    color: var(--muted); font-size: 0.8rem; padding: 7px 14px; width: 100%;
    justify-content: center;
  }
  .btn-clear:hover { border-color: #f76363; color: #f76363; }

  .annot { color: var(--muted); font-size: 0.7rem; margin-left: 4px; }
</style>
</head>
<body>

<header>
  <h1>Schedule → ICS</h1>
  <p>Convert your Altéa roster (.txt) or export (.csv) to a calendar file</p>
</header>

<div class="card">
  <h2>1 — Upload File</h2>
  <div class="dropzone" id="dropzone">
    <input type="file" id="fileInput" accept=".txt,.csv,.rtf,.doc">
    <div class="icon">📂</div>
    <div class="label">Drop file here or click to browse</div>
    <div class="sublabel">Supports Altéa .txt, legacy .doc/.rtf, and .csv</div>
  </div>
  <div class="file-name" id="fileName"></div>
  <button class="btn btn-clear" id="clearBtn" style="display:none">✕ Clear</button>
</div>

<div class="card">
  <h2>2 — Preview</h2>
  <div id="previewContent">
    <div class="empty-state">Upload a file to see a preview</div>
  </div>
</div>

<div class="card">
  <h2>3 — Export</h2>
  <button class="btn btn-primary" id="exportBtn" disabled>⬇ Download .ics File</button>
  <div class="status" id="statusMsg"></div>
</div>

<script>
const TZ       = 'Europe/Copenhagen';
const CAL_NAME = 'Work Schedule';

let parsedEvents     = [];
let allEvents        = [];
let detectedYear     = new Date().getFullYear();
let detectedMonth    = new Date().getMonth() + 1;
let detectedFilename = 'schedule';

const fileInput      = document.getElementById('fileInput');
const dropzone       = document.getElementById('dropzone');
const fileName       = document.getElementById('fileName');
const exportBtn      = document.getElementById('exportBtn');
const statusMsg      = document.getElementById('statusMsg');
const previewContent = document.getElementById('previewContent');

const clearBtn       = document.getElementById('clearBtn');

clearBtn.addEventListener('click', () => {
  window.location.reload(true); // hard reload, bypasses cache
});
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
dropzone.addEventListener('drop', e => {
  e.preventDefault(); dropzone.classList.remove('drag-over');
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => { if (fileInput.files[0]) handleFile(fileInput.files[0]); });

function handleFile(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  detectedFilename = file.name.replace(/\.[^.]+$/, '');
  fileName.textContent = '📄 ' + file.name;
  setStatus('', '');
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const raw = e.target.result;
      allEvents = ext === 'csv' ? parseCSV(raw) : parseAltea(raw);
      clearBtn.style.display = 'block';
      applyFilter();
    } catch(err) { setStatus('error', 'Parse error: ' + err.message); }
  };
  reader.readAsText(file, 'latin1');
}

function applyFilter() {
  parsedEvents = allEvents;
  renderPreview(parsedEvents, allEvents);
  exportBtn.disabled = parsedEvents.length === 0;
}

function detectYearMonth(text) {
  const months = ['january','february','march','april','may','june',
                  'july','august','september','october','november','december'];
  const lower = text.toLowerCase();
  for (let i = 0; i < months.length; i++) {
    if (lower.includes(months[i])) { detectedMonth = i + 1; break; }
  }
  const y = text.match(/20\d{2}/);
  if (y) detectedYear = parseInt(y[0]);
}

function addDays(dateStr, n) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
}

// Parse extra paid hours from annotation tokens like ADM(2.00), AFS(1.00), LVA(1)
function parseAnnotHours(tokens) {
  let extra = 0;
  for (const t of tokens) {
    const m = t.match(/^[A-Z]{2,}\(([\d.]+)\)/i);
    if (m) extra += parseFloat(m[1]);
  }
  return extra;
}

// Duration in hours including any paid annotation hours
function shiftHours(ev) {
  if (ev.allDay || !ev.start || !ev.end) return 0;
  const [sh, sm] = ev.start.split(':').map(Number);
  const [eh, em] = ev.end.split(':').map(Number);
  let mins = (eh * 60 + em) - (sh * 60 + sm);
  if (mins < 0) mins += 1440;
  return (mins / 60) + (ev.extraHours || 0);
}

function fmtHours(h) {
  const hrs  = Math.floor(h);
  const mins = Math.round((h - hrs) * 60);
  return mins ? `${hrs}h ${mins}m` : `${hrs}h`;
}

function makeShiftEvent(dateStr, start, end, type, summary, annots, extraHours) {
  const [sh, sm] = start.split(':').map(Number);
  const [eh, em] = end.split(':').map(Number);
  const endDate  = (eh * 60 + em) < (sh * 60 + sm) ? addDays(dateStr, 1) : dateStr;
  return { date: dateStr, summary, start, end, endDate, allDay: false, type, note: annots, extraHours: extraHours || 0 };
}
function makeFridag(dateStr) {
  return { date: dateStr, summary: 'Fridag', start: null, end: null, endDate: dateStr, allDay: true, type: 'fridag', note: '', extraHours: 0 };
}

// ── Main parser: Altéa plain text + legacy RTF ─────────────────────────
function parseAltea(raw) {
  let text = raw
    .replace(/\\'d8/gi,'Ø').replace(/\\'f8/gi,'ø')
    .replace(/\\'e6/gi,'æ').replace(/\\'c6/gi,'Æ')
    .replace(/\\'e5/gi,'å').replace(/\\'c5/gi,'Å')
    .replace(/\\[a-z]+[-]?\d*[ ]?/gi,'').replace(/[{}]/g,'').replace(/\r/g,'');

  detectYearMonth(text);

  // Build colleague code map: dateStr → code (from "Byt/NSA/xx  YYYYMMDD" lines)
  const colleagueMap = {};
  for (const line of text.split('\n')) {
    const m = line.match(/Byt\/([A-Z]+)\/[^\s]*\s+(\d{8})/i);
    if (m) {
      const ds = m[2];
      colleagueMap[`${ds.slice(0,4)}-${ds.slice(4,6)}-${ds.slice(6,8)}`] = m[1].toUpperCase();
    }
  }

  const events = [];

  for (const line of text.split('\n').map(l => l.trim()).filter(Boolean)) {

    // ── Altéa: "Thursday  2026/07/02 : 0445-1300G"
    const altea = line.match(/^\w+\s+(\d{4})\/(\d{2})\/(\d{2})\s*:\s*(.*)/);
    if (altea) {
      const dateStr = `${altea[1]}-${altea[2]}-${altea[3]}`;
      const tokens  = altea[4].trim().split(/\s+/).filter(Boolean);

      const hasByt    = tokens.some(t => /^byt$/i.test(t));
      const hasFridag = tokens.some(t => /^fridag$/i.test(t));
      const shiftToks = tokens.filter(t => /^\d{4}-\d{4}[A-Z]?$/.test(t));
      const annotToks = tokens.filter(t => /^[A-Z]{2,}\(/.test(t));
      const annotStr  = annotToks.join(' ');
      const extraHours = parseAnnotHours(annotToks);

      if (tokens.length === 0) continue; // empty day — no event

      if (hasFridag) events.push(makeFridag(dateStr));

      if (shiftToks.length === 0) continue; // gave swap or fridag only — no extra event

      for (const shiftStr of shiftToks) {
        const tm = shiftStr.match(/^(\d{2})(\d{2})-(\d{2})(\d{2})[A-Z]?$/);
        if (!tm) continue;
        const start = `${tm[1]}:${tm[2]}`, end = `${tm[3]}:${tm[4]}`;
        let type, summary;
        const timeLabel = `${tm[1]}${tm[2]}-${tm[3]}${tm[4]}`;
        if (hasByt) {
          const colleague = colleagueMap[dateStr];
          type    = 'extra-colleague';
          summary = `${timeLabel} (colleague)`;
          if (colleague && !annotStr) annotToks.push(colleague);
        } else if (hasFridag) {
          type    = 'extra-company';
          summary = `${timeLabel} (company fridag)`;
        } else {
          type    = 'shift';
          summary = timeLabel;
        }
        events.push(makeShiftEvent(dateStr, start, end, type, summary, annotStr, extraHours));
      }
      continue;
    }

    // ── Legacy RTF: "2 Thursday 0445-1300G note"
    const legacy = line.match(/^(\d{1,2})\s+\w+\s+([\w\-:().]+(?:\s+[\w\-.()]+)?)\s*(.*)/);
    if (legacy) {
      const day = parseInt(legacy[1]);
      if (day < 1 || day > 31) continue;
      const dateStr = `${detectedYear}-${String(detectedMonth).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      const shift   = legacy[2].trim();
      const note    = legacy[3].trim();
      if (/^fridag$/i.test(shift)) { events.push(makeFridag(dateStr)); continue; }
      const tm = shift.match(/^(\d{2})(\d{2})-(\d{2})(\d{2})[A-Z]?$/);
      if (tm) {
        events.push(makeShiftEvent(dateStr, `${tm[1]}:${tm[2]}`, `${tm[3]}:${tm[4]}`, 'shift',
          `${tm[1]}${tm[2]}-${tm[3]}${tm[4]}`, '', 0));
      }
      // unknown token on legacy RTF — skip, no event
    }
  }
  return events;
}

// ── CSV Parser ─────────────────────────────────────────────────────────
function parseCSV(raw) {
  const fixed = raw.replace(/\x00/g,'').replace(/F\nL /gi,'FØL ').replace(/f\nl /gi,'føl ');
  detectYearMonth(fixed);
  const lines = fixed.split('\n').map(l=>l.trim()).filter(Boolean);
  if (lines.length < 2) throw new Error('CSV appears empty');
  const events = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = splitCSVLine(lines[i]);
    if (cols.length < 3) continue;
    let subject     = cols[0].trim();
    const startDate = cols[1].trim();
    const startTime = cols[2].trim();
    const endTime   = cols[4] ? cols[4].trim() : '';
    const allDay    = cols[5] ? cols[5].trim().toUpperCase() === 'TRUE' : false;
    if (!startDate) continue;
    const dp = startDate.split('/');
    if (dp.length < 3) continue;
    const dateStr = `${dp[2]}-${dp[1].padStart(2,'0')}-${dp[0].padStart(2,'0')}`;
    subject = subject.replace(/^\d{4}-\d{4}[A-Z]?\s+/,'').replace(/[()]/g,'').trim();
    subject = subject.replace(/\b\w/g,c=>c.toUpperCase());
    if (/^fridag$/i.test(subject)) { events.push(makeFridag(dateStr)); continue; }
    if (allDay || !startTime) {
      events.push({ date: dateStr, summary: subject, start: null, end: null, endDate: dateStr, allDay: true, type: 'dayoff', note: '', extraHours: 0 });
    } else {
      let endDate = dateStr;
      if (endTime) {
        const sh = parseInt(startTime.slice(0,2)), sm = parseInt(startTime.slice(3)||startTime.slice(2,4));
        const eh = parseInt(endTime.slice(0,2)),   em = parseInt(endTime.slice(3)||endTime.slice(2,4));
        if ((eh*60+em)<(sh*60+sm)) endDate = addDays(dateStr,1);
      }
      const csvLabel = `${startTime.replace(':','')}${endTime ? '-'+endTime.replace(':','') : ''}`;
      events.push({ date: dateStr, summary: csvLabel, start: startTime, end: endTime||startTime, endDate, allDay: false, type: 'shift', note: '', extraHours: 0 });
    }
  }
  return events;
}

function splitCSVLine(line) {
  const result=[]; let cur='', inQ=false;
  for (const ch of line) {
    if (ch==='"') inQ=!inQ;
    else if (ch===','&&!inQ){result.push(cur);cur='';}
    else cur+=ch;
  }
  result.push(cur); return result;
}

// ── Stats ──────────────────────────────────────────────────────────────
function calcStats(all) {
  const shifts           = all.filter(e => e.type === 'shift');
  const extraCompany     = all.filter(e => e.type === 'extra-company');
  const extraColleague   = all.filter(e => e.type === 'extra-colleague');
  const fridager         = all.filter(e => e.type === 'fridag');

  // Fridager with no extra shift on same date = pure days off
  const extraDates       = new Set([...extraCompany, ...extraColleague].map(e => e.date));
  const fridagPure       = fridager.filter(e => !extraDates.has(e.date));
  const fridagWithWork   = fridager.filter(e => extraDates.has(e.date));

  const totalShiftHours    = shifts.map(shiftHours).reduce((a,b)=>a+b,0);
  const totalExtraCoHours  = extraCompany.map(shiftHours).reduce((a,b)=>a+b,0);
  const totalExtraColHours = extraColleague.map(shiftHours).reduce((a,b)=>a+b,0);
  const totalHours         = totalShiftHours + totalExtraCoHours + totalExtraColHours;

  return { shifts, extraCompany, extraColleague, fridager, fridagPure, fridagWithWork,
           totalShiftHours, totalExtraCoHours, totalExtraColHours, totalHours };
}

function typeBadge(type) {
  const map = {
    'shift':           ['badge-shift',           'shift'],
    'extra-company':   ['badge-extra-company',    'company extra'],
    'extra-colleague': ['badge-extra-colleague',  'colleague extra'],
    'dayoff':          ['badge-dayoff',           'day off'],
    'fridag':          ['badge-fridag',           'fridag'],
  };
  const [cls, label] = map[type] || ['badge-dayoff', type];
  return `<span class="badge ${cls}">${label}</span>`;
}

// ── Preview ────────────────────────────────────────────────────────────
function renderPreview(events, all) {
  if (!all || !all.length) {
    previewContent.innerHTML = '<div class="empty-state">No events found. Check file format.</div>';
    return;
  }
  const s = calcStats(all);

  let html = `<div class="preview-wrap"><table><thead><tr>
    <th>Date</th><th>Summary</th><th>Time</th><th>Type</th>
  </tr></thead><tbody>`;
  for (const ev of events) {
    const timeStr = ev.allDay ? '—'
      : ev.endDate !== ev.date ? `${ev.start}–${ev.end} <span class="annot">(+1)</span>`
      : `${ev.start}–${ev.end}`;
    const annotStr = ev.note ? `<span class="annot">${ev.note}</span>` : '';
    html += `<tr>
      <td>${ev.date}</td>
      <td>${ev.summary} ${annotStr}</td>
      <td>${timeStr}</td>
      <td>${typeBadge(ev.type)}</td>
    </tr>`;
  }
  html += `</tbody></table></div>`;

  html += `<div class="stats-grid">
    <div class="stat-box accent">
      <div class="stat-label">Shifts</div>
      <div class="stat-value">${s.shifts.length}</div>
      <div class="stat-sub">${fmtHours(s.totalShiftHours)}</div>
    </div>
    <div class="stat-box purple">
      <div class="stat-label">Fridager</div>
      <div class="stat-value">${s.fridager.length} <span style="font-size:0.8rem;font-weight:400;color:var(--muted)">(${s.fridagPure.length} free)</span></div>
      <div class="stat-sub">${s.fridagWithWork.length} with extra shift</div>
    </div>
    <div class="stat-box success">
      <div class="stat-label">Company Extra</div>
      <div class="stat-value">${s.extraCompany.length}</div>
      <div class="stat-sub">${fmtHours(s.totalExtraCoHours)}</div>
    </div>
    <div class="stat-box warn">
      <div class="stat-label">Colleague Extra</div>
      <div class="stat-value">${s.extraColleague.length}</div>
      <div class="stat-sub">${fmtHours(s.totalExtraColHours)}</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Total Hours</div>
      <div class="stat-value">${fmtHours(s.totalHours)}</div>
      <div class="stat-sub">incl. ADM/AFS/LVA/SVA</div>
    </div>
  </div>`;

  previewContent.innerHTML = html;
}

// ── ICS Generation ─────────────────────────────────────────────────────
function generateICS(events) {
  const now = new Date().toISOString().replace(/[-:.]/g,'').slice(0,15)+'Z';
  const tzBlock = [
    'BEGIN:VTIMEZONE',`TZID:${TZ}`,
    'BEGIN:STANDARD','DTSTART:19701025T030000','RRULE:FREQ=YEARLY;BYDAY=-1SU;BYMONTH=10',
    'TZOFFSETFROM:+0200','TZOFFSETTO:+0100','TZNAME:CET','END:STANDARD',
    'BEGIN:DAYLIGHT','DTSTART:19700329T020000','RRULE:FREQ=YEARLY;BYDAY=-1SU;BYMONTH=3',
    'TZOFFSETFROM:+0100','TZOFFSETTO:+0200','TZNAME:CEST','END:DAYLIGHT',
    'END:VTIMEZONE'
  ].join('\r\n');

  let cal = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//TCOBuddy//Schedule Converter//EN',
    'CALSCALE:GREGORIAN','METHOD:PUBLISH',`X-WR-CALNAME:${CAL_NAME}`,`X-WR-TIMEZONE:${TZ}`,tzBlock
  ].join('\r\n') + '\r\n';

  events.forEach((ev, idx) => {
    const uid     = `${ev.date.replace(/-/g,'')}-${idx}@tcobuddy`;
    const summary = ev.summary.replace(/,/g,'\\,').replace(/;/g,'\\;');
    const desc    = ev.note ? `DESCRIPTION:${ev.note}\r\n` : '';
    if (ev.allDay || !ev.start || !ev.end) {
      const d = ev.date.replace(/-/g,'');
      cal += `BEGIN:VEVENT\r\nUID:${uid}\r\nDTSTAMP:${now}\r\nDTSTART;VALUE=DATE:${d}\r\nDTEND;VALUE=DATE:${d}\r\nSUMMARY:${summary}\r\n${desc}END:VEVENT\r\n`;
    } else {
      const startDT  = ev.date.replace(/-/g,'')+'T'+ev.start.replace(':','')+'00';
      const endDate  = ev.endDate || ev.date;
      const endDT    = endDate.replace(/-/g,'')+'T'+ev.end.replace(':','')+'00';
      const [sh, sm] = ev.start.split(':').map(Number);
      const [eh, em] = ev.end.split(':').map(Number);
      let durMins = (eh*60+em) - (sh*60+sm);
      if (durMins < 0) durMins += 1440;
      const durH = Math.floor(durMins/60), durM = durMins%60;
      const duration = `DURATION:PT${durH}H${durM > 0 ? durM+'M' : ''}\r\n`;
      const crossesMidnight = endDate !== ev.date;
      cal += `BEGIN:VEVENT\r\nUID:${uid}\r\nDTSTAMP:${now}\r\nDTSTART;TZID=${TZ}:${startDT}\r\nDTEND;TZID=${TZ}:${endDT}\r\n${crossesMidnight ? duration : ''}SUMMARY:${summary}\r\n${desc}END:VEVENT\r\n`;
    }
  });
  return cal + 'END:VCALENDAR\r\n';
}

exportBtn.addEventListener('click', () => {
  if (!parsedEvents.length) return;
  try {
    const blob = new Blob([generateICS(parsedEvents)], {type:'text/calendar;charset=utf-8'});
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href=url; a.download=`${detectedFilename}.ics`; a.click();
    URL.revokeObjectURL(url);
    setStatus('success', `✓ Downloaded ${parsedEvents.length} events as .ics`);
  } catch(err) { setStatus('error','Export failed: '+err.message); }
});

function setStatus(type, msg) {
  statusMsg.className = 'status';
  if (!type) return;
  statusMsg.classList.add(type,'show');
  statusMsg.textContent = msg;
}
</script>
</body>
